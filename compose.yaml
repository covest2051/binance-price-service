services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-binance_prices}
      POSTGRES_USER: ${DB_USERNAME:-binance}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-binance}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    # no value: taken from the shell or .env, unset ones keep application.yml defaults
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME:
      DB_USERNAME:
      DB_PASSWORD:
      BINANCE_BASE_URL:
      BINANCE_SYMBOLS:
      BINANCE_POLL_INTERVAL:
      BINANCE_CONNECT_TIMEOUT:
      BINANCE_READ_TIMEOUT:
      BINANCE_DEFAULT_RETRY_AFTER:
      TREND_FLAT_THRESHOLD:
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3

volumes:
  postgres-data:
